<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeFolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ── CABEÇALHO ────────────────────────────────── -->
    <header class="header">
        <div class="header__inner">
            <a href="#" class="logo" id="logo-btn" aria-label="Voltar ao início">
                <span class="logo__icon" aria-hidden="true">🍽</span>
                <span class="logo__text">RecipeFolio</span>
            </a>
            <div class="search-bar" role="search">
                <input type="text" id="search-input" class="search-bar__input" placeholder="Buscar receitas…"
                    autocomplete="off" aria-label="Campo de busca">
                <button class="search-bar__btn" id="search-btn" aria-label="Buscar">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.35-4.35" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- ── NAVEGAÇÃO POR ABAS ───────────────────────── -->
    <nav class="tabs" aria-label="Navegação principal">
        <div class="tabs__inner">
            <button class="tab tab--active" id="tab-home">Início</button>
            <button class="tab" id="tab-catalog">Catálogo</button>
            <button class="tab" id="tab-favorites">
                Favoritos
                <span class="tab__badge" id="fav-count">0</span>
            </button>
        </div>
    </nav>

    <!-- ── BARRA DE LETRAS (visível só no catálogo) ── -->
    <div class="alpha-wrapper" id="alpha-wrapper" hidden>
        <div class="alpha-bar" id="alpha-bar" aria-label="Navegar por letra"></div>
    </div>

    <!-- ── CONTEÚDO PRINCIPAL ──────────────────────── -->
    <main class="main" id="main">

        <div class="loader" id="loader" hidden>
            <div class="loader__spinner" aria-hidden="true"></div>
            <p class="loader__text" id="loader-text">Carregando receitas…</p>
        </div>

        <div class="error-state" id="error-state" hidden>
            <span class="error-state__icon" aria-hidden="true">⚠️</span>
            <p class="error-state__msg" id="error-message"></p>
            <button class="btn-retry" id="retry-btn">Tentar novamente</button>
        </div>

        <div class="empty-state" id="empty-state" hidden>
            <span class="empty-state__icon" id="empty-icon" aria-hidden="true">🔍</span>
            <p class="empty-state__title" id="empty-title"></p>
            <p class="empty-state__desc" id="empty-desc"></p>
        </div>

        <div class="section-header" id="section-header" hidden>
            <p class="section-label" id="section-label"></p>
        </div>

        <div class="meals-grid" id="meals-grid" aria-label="Lista de receitas"></div>

    </main>

    <!-- ── MODAL DE DETALHES ────────────────────────── -->
    <div class="modal-overlay" id="modal-overlay" hidden role="dialog" aria-modal="true"
        aria-labelledby="modal-title-el">
        <div class="modal" id="modal">
            <button class="modal__close" id="modal-close" aria-label="Fechar">✕</button>
            <div class="modal__content" id="modal-content"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
