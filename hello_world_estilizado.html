<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050a05;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
        }

        #matrix {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(to bottom,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.08) 2px,
                    rgba(0, 0, 0, 0.08) 4px);
            pointer-events: none;
            z-index: 10;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0, 0, 0, 0.88) 100%);
            pointer-events: none;
            z-index: 9;
        }

        .container {
            position: relative;
            text-align: center;
            z-index: 5;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #39ff14;
            text-shadow:
                0 0 5px #39ff14,
                0 0 15px #39ff14,
                0 0 35px #39ff14,
                0 0 70px #1aff00,
                0 0 120px #0d8000;
            position: relative;
            animation: flicker 4s infinite;
        }

        h1::before,
        h1::after {
            content: 'Hello World!';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        h1::before {
            color: #00ffcc;
            text-shadow: 2px 0 #00ffcc;
            clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%);
            animation: glitch-top 3s infinite steps(1);
            opacity: 0.7;
        }

        h1::after {
            color: #ff00ff;
            text-shadow: -2px 0 #ff00ff;
            clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
            animation: glitch-bottom 2.5s infinite steps(1);
            opacity: 0.5;
        }

        .glitch-bar {
            position: absolute;
            left: -10%;
            width: 120%;
            height: 3px;
            background: rgba(57, 255, 20, 0.15);
            animation: scan-bar 6s linear infinite;
            pointer-events: none;
        }

        @keyframes flicker {

            0%,
            95%,
            100% {
                opacity: 1;
            }

            96% {
                opacity: 0.85;
            }

            97% {
                opacity: 1;
            }

            98% {
                opacity: 0.7;
            }

            99% {
                opacity: 1;
            }
        }

        @keyframes glitch-top {

            0%,
            80%,
            100% {
                transform: translate(0);
                clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%);
            }

            82% {
                transform: translate(-4px, -2px);
                clip-path: polygon(0 15%, 100% 15%, 100% 35%, 0 35%);
            }

            84% {
                transform: translate(4px, 1px);
                clip-path: polygon(0 25%, 100% 25%, 100% 45%, 0 45%);
            }

            86% {
                transform: translate(0);
            }
        }

        @keyframes glitch-bottom {

            0%,
            70%,
            100% {
                transform: translate(0);
                clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
            }

            72% {
                transform: translate(5px, 2px);
                clip-path: polygon(0 55%, 100% 55%, 100% 75%, 0 75%);
            }

            74% {
                transform: translate(-3px, -1px);
                clip-path: polygon(0 65%, 100% 65%, 100% 85%, 0 85%);
            }

            76% {
                transform: translate(0);
            }
        }

        @keyframes scan-bar {
            0% {
                top: -10px;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: calc(100% + 10px);
                opacity: 0;
            }
        }

        .bracket {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: rgba(57, 255, 20, 0.5);
            border-style: solid;
        }

        .bracket.tl {
            top: -16px;
            left: -16px;
            border-width: 2px 0 0 2px;
        }

        .bracket.tr {
            top: -16px;
            right: -16px;
            border-width: 2px 2px 0 0;
        }

        .bracket.bl {
            bottom: -16px;
            left: -16px;
            border-width: 0 0 2px 2px;
        }

        .bracket.br {
            bottom: -16px;
            right: -16px;
            border-width: 0 2px 2px 0;
        }
    </style>
</head>

<body>
    <canvas id="matrix"></canvas>

    <div class="container">
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
        <div class="glitch-bar"></div>
        <h1>Hello World!</h1>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        const FONT_SIZE = 14;
        const CHARS = '0123456789ABCDEF01アイウエオカキクケコサシスセソタチツテトナニヌネノ';

        let cols, drops;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cols = Math.floor(canvas.width / FONT_SIZE);
            drops = Array.from({ length: cols }, () => Math.random() * -canvas.height / FONT_SIZE);
        }

        resize();
        window.addEventListener('resize', resize);

        function draw() {
            ctx.fillStyle = 'rgba(5, 10, 5, 0.07)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = `${FONT_SIZE}px "Share Tech Mono", monospace`;

            for (let i = 0; i < drops.length; i++) {
                const char = CHARS[Math.floor(Math.random() * CHARS.length)];
                const y = drops[i] * FONT_SIZE;

                const isHead = drops[i] > 1 && Math.random() > 0.85;
                ctx.fillStyle = isHead
                    ? 'rgba(180, 255, 140, 0.18)'
                    : 'rgba(57, 120, 30, 0.13)';

                ctx.fillText(char, i * FONT_SIZE, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                drops[i] += 0.4 + Math.random() * 0.3;
            }
        }

        setInterval(draw, 40);
    </script>
</body>

</html>
